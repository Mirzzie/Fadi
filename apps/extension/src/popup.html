<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root { color-scheme: light dark; }
      body { width: 300px; margin: 0; font: 13px/1.4 system-ui, sans-serif; padding: 14px; }
      h1 { font-size: 14px; margin: 0 0 2px; }
      p.sub { margin: 0 0 12px; color: #777; font-size: 11px; }
      button { width: 100%; padding: 9px; border: 0; border-radius: 8px; font-weight: 600; cursor: pointer; margin-bottom: 8px; }
      .primary { background: #0f766e; color: #fff; }
      .ghost { background: transparent; color: #0f766e; border: 1px solid #0f766e33; font-weight: 500; }
      #status { font-size: 12px; min-height: 16px; margin-top: 4px; }
      .ok { color: #0f766e; } .err { color: #be123c; }
      .row { display: flex; gap: 6px; align-items: center; margin-top: 10px; }
      input { flex: 1; padding: 6px; border: 1px solid #ccc4; border-radius: 6px; font: inherit; }
      label { font-size: 11px; color: #777; }
    </style>
  </head>
  <body>
    <h1>Fadi</h1>
    <p class="sub">Save this job to your pipeline, or autofill the application.</p>
    <button id="scrapeall" class="primary">Scrape all jobs on this page</button>
    <button id="save" class="ghost">Save just this job</button>
    <button id="autofill" class="ghost">Autofill this application</button>
    <button id="evidence" class="ghost">Clip selection to Evidence</button>
    <button id="contact" class="ghost">Add referral (LinkedIn)</button>
    <div id="status"></div>
    <div class="row">
      <label for="base">Fadi&nbsp;URL</label>
      <input id="base" placeholder="http://localhost:3000" />
    </div>
    <script src="popup.js"></script>
  </body>
</html>
