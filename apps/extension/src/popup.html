<!doctype html>
<html lang="en" data-palette="ember" data-appearance="system">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fadi · Save and prepare</title>
    <script src="appearance-bootstrap.generated.js"></script>
    <link rel="stylesheet" href="appearance.generated.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <h1>Fadi</h1>
    <p class="sub">Save this job to your pipeline, or autofill the application.</p>
    <button id="scrapeall" class="primary">Capture jobs from this page</button>
    <button id="save" class="ghost">Save just this job</button>
    <button id="autofill" class="ghost">Autofill this application</button>
    <button id="evidence" class="ghost">Clip selection to Evidence</button>
    <button id="contact" class="ghost">Add referral (LinkedIn)</button>
    <div id="status" role="status" aria-live="polite"></div>
    <hr style="border: 0; border-top: 1px solid #8883; margin: 12px 0" />
    <label style="display: flex; align-items: center; gap: 8px; font-size: 12px; margin-bottom: 10px; cursor: pointer">
      <input id="autocapture" type="checkbox" style="width: auto; margin: 0" />
      Auto-capture jobs on LinkedIn &amp; Indeed
    </label>
    <div id="connstate" style="font-size: 11px; margin-bottom: 6px; color: var(--muted-foreground)">Not connected.</div>
    <label for="token">Connection code</label>
    <div class="row">
      <input id="token" type="password" autocomplete="off" placeholder="Paste connection code" />
    </div>
    <div class="row">
      <button id="getcode" class="ghost" style="flex: 1; margin: 0">Get code</button>
      <button id="connect" class="primary" style="flex: 1; margin: 0">Connect</button>
    </div>
    <div class="row">
      <label for="base">Fadi&nbsp;URL</label>
      <input id="base" placeholder="http://localhost:3000" />
    </div>
    <details class="appearance-disclosure">
      <summary>Appearance</summary>
      <label for="palette">Colour palette</label>
      <select id="palette"><option value="ember">Ember · warm coral</option><option value="iris">Iris · soft violet</option><option value="cobalt">Cobalt · clear blue</option></select>
      <label for="brightness">Brightness</label>
      <select id="brightness"><option value="system">Follow system</option><option value="light">Light</option><option value="dark">Dark</option></select>
      <p id="appearance-note" role="status">Applies to this extension in this browser.</p>
    </details>
    <script type="module" src="appearance.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
