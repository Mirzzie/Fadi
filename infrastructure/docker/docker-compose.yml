services:
  postgres:
    image: postgres:17-alpine
    container_name: careeros-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: careeros
      POSTGRES_PASSWORD: careeros
      POSTGRES_DB: careeros
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - careeros_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careeros -d careeros"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Free, self-hosted metasearch — powers the Fadi Web Crawler at ZERO cost (no API key).
  # Start with:  docker compose -f infrastructure/docker/docker-compose.yml up -d searxng
  # Then set in apps/web/.env.local:  SEARXNG_URL=http://localhost:8888
  searxng:
    image: searxng/searxng:latest
    container_name: careeros-searxng
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SEARXNG_HOST_PORT:-8888}:8080"
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      SEARXNG_BASE_URL: http://localhost:${SEARXNG_HOST_PORT:-8888}/

  # ── Fadi's voice, fully local and free ────────────────────────────────────────
  # The orb used Groq's free cloud tier to hear (Whisper) and speak (Orpheus), and its daily
  # limits ran out mid-conversation. These two run on this machine instead: no key, no quota,
  # nothing leaves the laptop. The app already prefers them when these are set in
  # apps/web/.env.local (the cloud stays as a fallback only):
  #   FADI_STT_LOCAL_BASE=http://localhost:8000/v1
  #   FADI_STT_LOCAL_MODEL=Systran/faster-whisper-small.en
  #   FADI_TTS_LOCAL_BASE=http://localhost:8880/v1
  #   FADI_TTS_LOCAL_VOICE=am_michael
  # CPU images, so no GPU driver setup is needed; first start downloads the models once.

  # Speech → text: faster-whisper behind an OpenAI-compatible /v1/audio/transcriptions.
  speaches:
    image: ghcr.io/speaches-ai/speaches:latest-cpu
    container_name: careeros-speaches
    restart: unless-stopped
    ports:
      - "127.0.0.1:${STT_HOST_PORT:-8000}:8000"
    environment:
      # Speaches realtime calls its own OpenAI-compatible transcription route. Without an
      # explicit loopback URL, current images build that internal request with an invalid
      # base path and return 404 after speech is detected.
      LOOPBACK_HOST_URL: http://127.0.0.1:8000
    volumes:
      - careeros_hf_cache:/home/ubuntu/.cache/huggingface/hub

  # Text → speech: Kokoro-82M behind an OpenAI-compatible /v1/audio/speech.
  kokoro:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:latest
    container_name: careeros-kokoro
    restart: unless-stopped
    ports:
      - "127.0.0.1:${TTS_HOST_PORT:-8880}:8880"

volumes:
  careeros_postgres_data:
  careeros_hf_cache:
