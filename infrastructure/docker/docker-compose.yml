services:
  postgres:
    image: postgres:17-alpine
    container_name: careeros-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: careeros
      POSTGRES_PASSWORD: careeros
      POSTGRES_DB: careeros
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - careeros_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careeros -d careeros"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Free, self-hosted metasearch — powers the Fadi Web Crawler at ZERO cost (no API key).
  # Start with:  docker compose -f infrastructure/docker/docker-compose.yml up -d searxng
  # Then set in apps/web/.env.local:  SEARXNG_URL=http://localhost:8888
  searxng:
    image: searxng/searxng:latest
    container_name: careeros-searxng
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SEARXNG_HOST_PORT:-8888}:8080"
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      SEARXNG_BASE_URL: http://localhost:${SEARXNG_HOST_PORT:-8888}/

volumes:
  careeros_postgres_data:
