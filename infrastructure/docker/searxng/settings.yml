# Minimal SearXNG config for the Fadi Web Crawler. `use_default_settings: true` merges this on
# top of SearXNG's defaults, so we only override what the crawler needs:
#   - JSON output (disabled by default) so Fadi can read results as JSON
#   - the limiter off, since Fadi is the only (local) client
# This runs entirely on your machine — free, no API key, no data leaves your box except the
# searches SearXNG forwards to public engines.
use_default_settings: true

server:
  # Any random string ≥ 16 chars. Local-only instance, so this is low-stakes — but change it.
  secret_key: "fadi-local-searxng-change-me-please-0192"
  limiter: false
  image_proxy: false

search:
  formats:
    - html
    - json
  # Be gentle so public engines don't rate-limit your instance.
  autocomplete: ""

# WHICH ENGINES ANSWER A LOCAL INSTANCE.
#
# Measured 21 Sep 2026 against this container: duckduckgo returns a CAPTCHA immediately, brave
# suspends with 429 after a few searches, and qwant CAPTCHAs - so a crawl running three query
# variants came back with ZERO results and no error, which reads as "no jobs in Dublin". Bing,
# Google and Yahoo answered every site:-scoped job search. The rest are disabled so the response
# carries results rather than excuses; Fadi treats an answer where every engine failed as a
# backend failure, not an empty market.
engines:
  - name: duckduckgo
    disabled: true
  - name: brave
    disabled: true
  - name: qwant
    disabled: true
  - name: wikidata
    disabled: true
  - name: wikipedia
    disabled: true
  - name: bing
    disabled: false
  - name: google
    disabled: false
  - name: yahoo
    disabled: false

outgoing:
  # Public engines are slower than a local service; the default timeout turned working engines
  # into "unresponsive" ones.
  request_timeout: 6.0
  max_request_timeout: 12.0

